name: Release CI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Build version (leave empty to append the workflow run number)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  prepare:
    name: Resolve build version
    runs-on: windows-2022
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve and validate version
        id: version
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          $version = & .\.github\scripts\Resolve-BuildVersion.ps1 `
            -RequestedVersion $env:REQUESTED_VERSION `
            -EventName $env:EVENT_NAME `
            -RefName $env:REF_NAME `
            -RunNumber ([uint64]$env:RUN_NUMBER)
          "version=$version" >> $env:GITHUB_OUTPUT
          "## Build version: $version" >> $env:GITHUB_STEP_SUMMARY

      - name: Validate version resolver boundaries
        shell: pwsh
        run: |
          $beforeBoundary = & .\.github\scripts\Resolve-BuildVersion.ps1 -RunNumber 65535
          $atBoundary = & .\.github\scripts\Resolve-BuildVersion.ps1 -RunNumber 65536
          $beforeParts = $beforeBoundary.Split('.')
          $boundaryParts = $atBoundary.Split('.')
          if ($beforeParts[-1] -ne '65535' -or
              [uint64]$boundaryParts[0] -ne ([uint64]$beforeParts[0] + 1) -or
              $boundaryParts[1] -ne $beforeParts[1] -or
              $boundaryParts[-1] -ne '1') {
            throw "Automatic version rollover is invalid: '$beforeBoundary' -> '$atBoundary'."
          }

          $requested = & .\.github\scripts\Resolve-BuildVersion.ps1 `
            -RequestedVersion '7.89.65535' `
            -RunNumber ([uint64]::MaxValue)
          if ($requested -ne '7.89.65535') {
            throw "An explicit version was unexpectedly changed to '$requested'."
          }

          $invalidRejected = $false
          try {
            & .\.github\scripts\Resolve-BuildVersion.ps1 `
              -RequestedVersion '7.89.65536' `
              -RunNumber 1 | Out-Null
          } catch {
            $invalidRejected = $true
          }
          if (!$invalidRejected) {
            throw 'An invalid explicit version was accepted.'
          }

  build:
    name: Build ${{ matrix.name }}
    needs: prepare
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x64
            platform: x64
            output_dir: Bin/x64/Release (lite)
          - name: x86
            platform: x86
            output_dir: Bin/Release (lite)
          - name: ARM64EC
            platform: ARM64EC
            output_dir: Bin/ARM64EC/Release (lite)

    steps:
      - uses: actions/checkout@v7

      - name: Stamp build version
        shell: pwsh
        env:
          BUILD_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          & .\.github\scripts\Set-ProjectVersion.ps1 -Version $env:BUILD_VERSION

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3

      - name: Build Lite edition
        shell: pwsh
        run: |
          msbuild TrafficMonitor_Lite.sln `
            /m `
            /t:Build `
            /p:Configuration="Release (lite)" `
            /p:Platform="${{ matrix.platform }}" `
            /p:PlatformToolset=v143

      - name: Verify build outputs
        shell: pwsh
        env:
          OUTPUT_DIR: ${{ matrix.output_dir }}
        run: |
          $executable = Join-Path $env:OUTPUT_DIR 'TrafficMonitor.exe'
          if (!(Test-Path -LiteralPath $executable)) {
            throw "Expected build output was not found: $executable"
          }
          $versionInfo = [Diagnostics.FileVersionInfo]::GetVersionInfo($executable)
          if ($versionInfo.FileVersion -ne $env:TRAFFICMONITOR_PE_VERSION -or
              $versionInfo.ProductVersion -ne $env:TRAFFICMONITOR_PE_VERSION) {
            throw "Built executable version '$($versionInfo.FileVersion)' does not match '$env:TRAFFICMONITOR_PE_VERSION'."
          }
          "Built $executable with version ${{ needs.prepare.outputs.version }}" >> $env:GITHUB_STEP_SUMMARY

      - name: Upload program files
        uses: actions/upload-artifact@v7
        with:
          name: TrafficMonitor_${{ needs.prepare.outputs.version }}_${{ matrix.name }}_Lite_run-${{ github.run_number }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: ${{ matrix.output_dir }}/TrafficMonitor.exe

      - name: Upload debug symbols
        uses: actions/upload-artifact@v7
        with:
          name: TrafficMonitor_${{ needs.prepare.outputs.version }}_${{ matrix.name }}_Lite_pdb_run-${{ github.run_number }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: ${{ matrix.output_dir }}/*.pdb
