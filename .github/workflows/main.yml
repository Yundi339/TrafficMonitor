name: Release CI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Build version (leave empty to append the workflow run number)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  prepare:
    name: Resolve build version
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve and validate version
        id: version
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          $version = & .\.github\scripts\Resolve-BuildVersion.ps1 `
            -RequestedVersion $env:REQUESTED_VERSION `
            -EventName $env:EVENT_NAME `
            -RefName $env:REF_NAME `
            -RunNumber ([int]$env:RUN_NUMBER)
          "version=$version" >> $env:GITHUB_OUTPUT
          "## Build version: $version" >> $env:GITHUB_STEP_SUMMARY

  build:
    name: Build ${{ matrix.name }}
    needs: prepare
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x64
            platform: x64
            output_dir: Bin/x64/Release (lite)
          - name: x86
            platform: x86
            output_dir: Bin/Release (lite)
          - name: ARM64EC
            platform: ARM64EC
            output_dir: Bin/ARM64EC/Release (lite)

    steps:
      - uses: actions/checkout@v4

      - name: Stamp build version
        shell: pwsh
        env:
          BUILD_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          & .\.github\scripts\Set-ProjectVersion.ps1 -Version $env:BUILD_VERSION

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build Lite edition
        shell: pwsh
        run: |
          msbuild TrafficMonitor_Lite.sln `
            /m `
            /t:Build `
            /p:Configuration="Release (lite)" `
            /p:Platform="${{ matrix.platform }}" `
            /p:PlatformToolset=v143

      - name: Verify build outputs
        shell: pwsh
        env:
          OUTPUT_DIR: ${{ matrix.output_dir }}
        run: |
          $executable = Join-Path $env:OUTPUT_DIR 'TrafficMonitor.exe'
          if (!(Test-Path -LiteralPath $executable)) {
            throw "Expected build output was not found: $executable"
          }
          $versionInfo = [Diagnostics.FileVersionInfo]::GetVersionInfo($executable)
          if ($versionInfo.FileVersion -ne $env:TRAFFICMONITOR_PE_VERSION -or
              $versionInfo.ProductVersion -ne $env:TRAFFICMONITOR_PE_VERSION) {
            throw "Built executable version '$($versionInfo.FileVersion)' does not match '$env:TRAFFICMONITOR_PE_VERSION'."
          }
          "Built $executable with version ${{ needs.prepare.outputs.version }}" >> $env:GITHUB_STEP_SUMMARY

      - name: Upload program files
        uses: actions/upload-artifact@v4
        with:
          name: TrafficMonitor_${{ needs.prepare.outputs.version }}_${{ matrix.name }}_Lite_run-${{ github.run_number }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            ${{ matrix.output_dir }}/TrafficMonitor.exe
            ${{ matrix.output_dir }}/*.dll

      - name: Upload debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: TrafficMonitor_${{ needs.prepare.outputs.version }}_${{ matrix.name }}_Lite_pdb_run-${{ github.run_number }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: ${{ matrix.output_dir }}/*.pdb
